nelmio_api_doc:
    documentation:
        info:
            title: GreenGoodies
            description: Documentation Api GreenGoodies
            version: 1.0.0

        paths:
            /api/login:
                post:
                    operationId: postCredentialsItem
                    tags:
                        - Authentification
                    summary: Permet d'obtenir le token JWT pour se logger.
                    requestBody:
                        description: Crée un nouveau token JWT
                        content:
                            application/json:
                                schema:
                                    $ref: '#/components/schemas/Credentials'
                    responses:
                        '200':
                            description: Récupère le token JWT
                            content:
                                application/json:
                                    schema:
                                        $ref: '#/components/schemas/Token'
        components:
            schemas:
                Token:
                    type: object
                    properties:
                        token:
                            type: string
                            readOnly: true
                Credentials:
                    type: object
                    properties:
                        username:
                            type: string
                            default: test@gmail.com
                        password:
                            type: string
                            default: 123
            securitySchemes:
                Bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
        security:
            -   Bearer: []
    areas:
        path_patterns:
            - ^/api(?!/doc$)
